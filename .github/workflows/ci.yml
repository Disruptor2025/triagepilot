name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit + API tests
        run: pytest -q
      - name: Model evaluation (fails the build if the router regresses)
        run: |
          python -m scripts.generate_data
          python -m scripts.evaluate
          python -c "import json,sys; m=json.load(open('reports/metrics.json')); f1=m['tfidf_logreg']['macro_f1']; print('macro F1', f1); sys.exit(0 if f1 >= 0.85 else 1)"
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: reports/

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: triagepilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: API tests against PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/triagepilot
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t triagepilot .
